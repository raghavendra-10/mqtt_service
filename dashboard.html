<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodEnergies MQTT Test Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #888;
            margin-top: 5px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }
        .chart-container {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #0f3460;
        }
        .chart-title {
            margin-bottom: 15px;
            color: #00d4ff;
        }
        canvas {
            max-height: 300px;
        }
        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #16213e;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            border: 1px solid #0f3460;
        }
        .status.connected {
            border-color: #00ff88;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .inverter-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        .inverter-selector button {
            background: #0f3460;
            color: #eee;
            border: 1px solid #00d4ff;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .inverter-selector button:hover, .inverter-selector button.active {
            background: #00d4ff;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <h1>GoodEnergies MQTT Test Dashboard</h1>
    <p class="subtitle">Real-time Solar Plant Monitoring (Auto-refresh every 5 seconds)</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalReadings">-</div>
            <div class="stat-label">Inverter Readings</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalWeather">-</div>
            <div class="stat-label">Weather Readings</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalCalculations">-</div>
            <div class="stat-label">Yield Calculations</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="latestTime">-</div>
            <div class="stat-label">Latest Update</div>
        </div>
    </div>

    <div class="inverter-selector">
        <button class="active" data-id="b1b2c3d4-e5f6-7890-abcd-ef1234567891">INV-001</button>
        <button data-id="b1b2c3d4-e5f6-7890-abcd-ef1234567892">INV-002</button>
        <button data-id="b1b2c3d4-e5f6-7890-abcd-ef1234567893">INV-003</button>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <h3 class="chart-title">Power Output (kW)</h3>
            <canvas id="powerChart"></canvas>
        </div>
        <div class="chart-container">
            <h3 class="chart-title">Daily Yield (kWh)</h3>
            <canvas id="yieldChart"></canvas>
        </div>
        <div class="chart-container">
            <h3 class="chart-title">Performance Ratio (%)</h3>
            <canvas id="prChart"></canvas>
        </div>
        <div class="chart-container">
            <h3 class="chart-title">Irradiance (W/m²)</h3>
            <canvas id="irradianceChart"></canvas>
        </div>
    </div>

    <div class="status connected">
        <span class="status-dot"></span>
        <span id="statusText">Connecting...</span>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let selectedInverter = 'b1b2c3d4-e5f6-7890-abcd-ef1234567891';
        let charts = {};

        // Chart configuration
        const chartConfig = {
            type: 'line',
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { color: '#333' },
                        ticks: { color: '#888' }
                    },
                    y: {
                        grid: { color: '#333' },
                        ticks: { color: '#888' }
                    }
                }
            }
        };

        // Initialize charts
        function initCharts() {
            charts.power = new Chart(document.getElementById('powerChart'), {
                ...chartConfig,
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        borderColor: '#00d4ff',
                        backgroundColor: 'rgba(0, 212, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                }
            });

            charts.yield = new Chart(document.getElementById('yieldChart'), {
                ...chartConfig,
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Actual',
                            data: [],
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Expected',
                            data: [],
                            borderColor: '#ff6b6b',
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    ...chartConfig.options,
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: '#888' }
                        }
                    }
                }
            });

            charts.pr = new Chart(document.getElementById('prChart'), {
                ...chartConfig,
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        borderColor: '#ffd93d',
                        backgroundColor: 'rgba(255, 217, 61, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                }
            });

            charts.irradiance = new Chart(document.getElementById('irradianceChart'), {
                ...chartConfig,
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        borderColor: '#ff9f43',
                        backgroundColor: 'rgba(255, 159, 67, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                }
            });
        }

        // Fetch and update stats
        async function updateStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();

                document.getElementById('totalReadings').textContent = stats.total_readings;
                document.getElementById('totalWeather').textContent = stats.total_weather;
                document.getElementById('totalCalculations').textContent = stats.total_calculations;

                if (stats.latest_reading_time) {
                    const time = new Date(stats.latest_reading_time);
                    document.getElementById('latestTime').textContent = time.toLocaleTimeString();
                }

                document.getElementById('statusText').textContent = 'Connected - Auto-refreshing';
            } catch (error) {
                document.getElementById('statusText').textContent = 'Connection error';
                console.error('Stats error:', error);
            }
        }

        // Fetch and update charts
        async function updateCharts() {
            try {
                // Get inverter readings
                const readingsRes = await fetch(`${API_BASE}/inverters/${selectedInverter}/readings?limit=50`);
                const readings = await readingsRes.json();

                // Get yield calculations
                const yieldRes = await fetch(`${API_BASE}/inverters/${selectedInverter}/yield?limit=50`);
                const yieldData = await yieldRes.json();

                // Reverse to show oldest first
                readings.reverse();
                yieldData.reverse();

                // Update power chart
                const powerLabels = readings.map(r => new Date(r.timestamp).toLocaleTimeString());
                const powerData = readings.map(r => r.active_power || 0);
                charts.power.data.labels = powerLabels;
                charts.power.data.datasets[0].data = powerData;
                charts.power.update('none');

                // Update yield chart
                const yieldLabels = yieldData.map(y => new Date(y.timestamp).toLocaleTimeString());
                const actualYield = yieldData.map(y => y.actual_yield || 0);
                const expectedYield = yieldData.map(y => y.expected_yield || 0);
                charts.yield.data.labels = yieldLabels;
                charts.yield.data.datasets[0].data = actualYield;
                charts.yield.data.datasets[1].data = expectedYield;
                charts.yield.update('none');

                // Update PR chart
                const prData = yieldData.map(y => y.performance_ratio_pct || 0);
                charts.pr.data.labels = yieldLabels;
                charts.pr.data.datasets[0].data = prData;
                charts.pr.update('none');

                // Update irradiance chart
                const irradianceData = yieldData.map(y => y.irradiance || 0);
                charts.irradiance.data.labels = yieldLabels;
                charts.irradiance.data.datasets[0].data = irradianceData;
                charts.irradiance.update('none');

            } catch (error) {
                console.error('Charts error:', error);
            }
        }

        // Inverter selector buttons
        document.querySelectorAll('.inverter-selector button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.inverter-selector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedInverter = btn.dataset.id;
                updateCharts();
            });
        });

        // Initialize and start auto-refresh
        initCharts();
        updateStats();
        updateCharts();

        // Auto-refresh every 5 seconds
        setInterval(() => {
            updateStats();
            updateCharts();
        }, 5000);
    </script>
</body>
</html>
