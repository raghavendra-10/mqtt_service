# Mosquitto Configuration for GoodEnergies MQTT Test

# Listener for MQTT protocol
listener 1883
protocol mqtt

# Listener for WebSocket (optional, for browser-based testing)
listener 9001
protocol websockets

# Allow anonymous connections (for testing only)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Message size limit (10MB)
message_size_limit 10485760
